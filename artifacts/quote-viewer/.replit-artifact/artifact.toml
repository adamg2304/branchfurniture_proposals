kind = "web"
previewPath = "/"
title = "Branch Quote Viewer"
version = "1.0.0"
id = "artifacts/quote-viewer"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23264

[services.development]
run = "pnpm --filter @workspace/quote-viewer run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/quote-viewer", "run", "build" ]
serve = "static"
publicDir = "artifacts/quote-viewer/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23264"
BASE_PATH = "/"
